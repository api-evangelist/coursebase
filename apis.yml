name: Coursebase
description: Coursebase is an AI-powered corporate Learning Management System (LMS) used by over 1,000
  organizations to create, deliver, and manage employee training across online, in-person, and blended
  formats. The platform offers a library of 1,000+ pre-built eLearning courses, AI-assisted content
  generation (auto-generated test questions and course summaries), analytics and reporting dashboards,
  single sign-on, multi-language support, and API-based integration with external HR systems for
  syncing user account information. Coursebase was surfaced as a portfolio company of 500 Global and
  enriched in the API Evangelist network; the public surface is a marketing site with an enterprise
  "contact us" API integration offering rather than a self-serve developer portal or published OpenAPI.
